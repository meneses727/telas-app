databases:
  - name: telas-db
    databaseName: telas_db
    user: telas_user
    plan: free
    region: oregon

services:
  - type: web
    name: telas-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: telas-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "60"
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: https://telas-frontend.onrender.com

  - type: web
    name: telas-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://telas-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
